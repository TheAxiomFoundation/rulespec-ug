name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@90dd838fc212c6eb14e7b01c69f06dd0860811d9
    secrets: inherit
    with:
      # Probe: axiom-encode fa0da5e8 (#1853, encoder 0.2.2211) with the shared
      # workflow at 90dd838f (cc135a6b plus .github#157, a draft under test).
      # fa0da5e8 checks a pull request that changes manifests alone and admits
      # a producer that descends from the pin; it predates axiom-encode#1989.
      axiom-encode-ref: fa0da5e834214052cc8d9d381e25ff409dd1062f
      axiom-rules-engine-ref: 363c6a6c56f7ad130996b63f7a09cfd4c3d9b021
      axiom-corpus-ref: a7abe870101f744f136cf8185f3824b3812bfd45
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      # The guard is on and stays on. It rejects a changed module unless its encoder
      # manifest matches the validator's encoder (axiom-encode-ref above). Signed
      # re-encodes (axiom-encode's targeted-signed-reencode workflow) generate with a
      # newer encoder, so their PRs are rejected until the validator moves
      # to that encoder together with re-encodes of the modules that fail at it
      # (TheAxiomFoundation/rulespec-ug#23). Do not set this to false to get a PR through.
      run-generated-guard: true
      # Composed-pilot programs/ guarding, as piloted in rulespec-uk and
      # adopted by rulespec-gh (encode#1053).
      guard-programs-root: false
